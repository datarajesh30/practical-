```yaml
name: Build and deploy Django app - Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ODBC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: build-only
          DJANGO_DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: localhost
          DB_NAME: x
          DB_USER: x
          DB_PASSWORD: x
          DB_HOST: x
          DB_PORT: '1433'
        run: |
          python manage.py collectstatic --noinput

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !__pycache__/
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4189307BF4294DF29C762ECBD8E89351 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_18C2F8817BA846E88671496F26ECA48E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C8D5D052F60443B8C5AEC61D2CDAAE2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: webapp7234
          slot-name: Production
```
